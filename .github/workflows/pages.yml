name: Publish the WebHID console to GitHub Pages

# The site is the single file in web/. Every push to main publishes it.
#
# Pages must exist with the "GitHub Actions" source before the first run. The
# workflow token cannot create it, so do it once per fork with either the
# repository settings or:
#   gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish. Do not cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web/
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
